set -g mouse on
set -g focus-events on          # Claude Code / vim notice focus changes
set -s set-clipboard on         # OSC52: copies reach the system clipboard
set -g history-limit 50000
setw -g mode-keys vi

# drag-select copies without jumping to the bottom
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear pbcopy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy

# alacritty advertises TERM=alacritty; tmux needs its own terminfo plus
# passthrough for what the outer terminal can actually do
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB:usstyle:hyperlinks:clipboard"
set -as terminal-overrides ",alacritty*:Smulx=\E[4:%p1%dm,Setulc=\E[58:2::%p1%{65536}/%d:%p1%{256}/%{256}%m%d:%p1%{256}%m%dm"

# ─── rice: catppuccin mocha bubbles, matching the starship prompt ───
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"   # default bg = alacritty opacity shows through

# window numbering that matches the keyboard
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# left: session bubble
set -g status-left-length 40
set -g status-left "#[fg=#cba6f7]#[bg=#cba6f7,fg=#11111b,bold] #{?client_prefix,󰐾,󰆍} #S #[bg=default,fg=#cba6f7] "

# right: host + clock bubbles
set -g status-right-length 60
set -g status-right "#[fg=#45475a]#[bg=#45475a,fg=#a6adc8] 󰒋 #{=12:host_short} #[bg=default,fg=#45475a] #[fg=#b4befe]#[bg=#b4befe,fg=#11111b]  %R #[bg=default,fg=#b4befe]"

# windows: named after the current dir's basename, so deep paths stay short
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#313244]#[bg=#313244,fg=#a6adc8] #I #W #[bg=default,fg=#313244] "
setw -g window-status-current-format "#[fg=#fab387]#[bg=#fab387,fg=#11111b,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[bg=default,fg=#fab387] "
setw -g window-status-bell-style "fg=#f38ba8,bold"

# panes: the active one is obvious at a glance when two sit side by side
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#cba6f7"

# messages, prompts, copy mode
set -g message-style "bg=#cba6f7,fg=#11111b,bold"
set -g message-command-style "bg=#45475a,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#f9e2af"
set -g clock-mode-colour "#cba6f7"

# ─── scrolling ───
# tmux scrolls by whole lines, so "smooth" means small steps: alacritty sends
# 1 line per tick (scrolling.multiplier) and tmux moves 1 per event.
# Too slow over long output? raise the 1s here, or the multiplier, not both.
bind -T copy-mode-vi WheelUpPane   send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 1 scroll-down
set -s escape-time 0
